[project]
name = "r4-daemon"
version = "0.1.1"  # x-release-please-version
description = "Telemetry and build monitoring daemon for Arduino R4"
requires-python = ">=3.10"
dependencies = [
    "gputil>=1.4.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
