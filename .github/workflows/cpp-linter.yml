name: C++ Linter

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  filter:
    name: Filter Changes
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.changes.outputs.cpp }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            cpp:
              - 'firmware/**'
              - '.clang-format'

  clang-format:
    name: clang-format
    needs: filter
    runs-on: ubuntu-latest
    if: needs.filter.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup clang-format
        run: sudo apt-get install -y clang-format

      - name: Run clang-format check
        run: |
          find firmware/src firmware/include -name "*.cpp" -o -name "*.h" | xargs clang-format --Werror --dry-run
