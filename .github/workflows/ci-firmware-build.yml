name: CI - Firmware Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  filter:
    name: Filter Changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.changes.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            firmware:
              - 'firmware/**'

  build:
    name: Compile Firmware (PlatformIO)
    needs: filter
    runs-on: ubuntu-latest
    if: needs.filter.outputs.firmware == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO Core
        run: pip install -U platformio

      - name: Build Arduino Firmware
        working-directory: ./firmware
        run: pio run
