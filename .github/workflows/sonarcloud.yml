name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install -U platformio

      - name: Install build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v8
        env:
          SONAR_HOST_URL: "https://sonarcloud.io"

      - name: Run build-wrapper
        run: |
          build-wrapper-linux-x86-64 --out-dir bw-output make build

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Tugamer89_r4-dev-dashboard
            -Dsonar.organization=tugamer89
            -Dsonar.cfamily.build-wrapper-output=bw-output
            -Dsonar.sources=firmware/src,firmware/include,daemon/src
